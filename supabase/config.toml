project_id = "mr-rahaman-business-ecosystem"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = false
enable_confirmations = false

# First-owner bootstrap must require a valid Supabase Auth JWT.
[functions.owner-bootstrap]
verify_jwt = true
