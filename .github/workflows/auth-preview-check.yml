name: Authentication Preview Checks

on:
  push:
    branches:
      - feature/branch-module-v1
      - feature/customer-access-v1
    paths:
      - 'auth-preview/**'
      - 'supabase/drafts/customer_access_v1.sql'
      - 'supabase/drafts/customer_access_v1_rollback.sql'
      - 'supabase/drafts/customer_service_admin_settings_v1.sql'
      - 'supabase/drafts/customer_service_admin_settings_v1_rollback.sql'
      - 'docs/CUSTOMER_EXPERIENCE_AND_DATA_STANDARD.md'
      - 'docs/CUSTOMER_SERVICE_ADMIN_SETTINGS_V1.md'
      - 'supabase/tests/**'
      - 'supabase/functions/auth-preview/index.ts'
      - '.github/workflows/auth-preview-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'auth-preview/**'
      - '.github/workflows/auth-preview-check.yml'

permissions:
  contents: read

jobs:
  static-auth-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Customer Access SQL in disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/customer_access_test_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/customer_access_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/customer_access_v1.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/customer_service_admin_settings_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/customer_service_admin_settings_v1.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/customer_service_admin_settings_v1_rollback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/customer_service_admin_settings_v1_rollback.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/customer_access_v1_rollback.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/customer_access_v1_rollback.integration.sql
      - name: Validate authentication preview
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('auth-preview/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(Boolean);
          if (!scripts.length) throw new Error('No inline application script found');
          for (const script of scripts) new vm.Script(script);

          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));

          const references = [...html.matchAll(/\$\(["']([^"']+)["']\)/g)].map(match => match[1]);
          const missing = [...new Set(references.filter(id => !ids.includes(id)))];
          if (missing.length) throw new Error('Missing DOM IDs: ' + missing.join(', '));

          const phoneOtp = /phoneVerifyPane|sendPhoneOtpBtn|verifyPhoneOtpBtn|phoneOtp|phone_pending|phone_confirmed_at|normalizeBDPhone|regPhone|মোবাইল OTP/i;
          if (phoneOtp.test(html)) throw new Error('Phone OTP flow must remain removed');

          for (const required of ['signInWithPassword', 'signUp(', 'resetPasswordForEmail', 'current_access_context_v1', 'dashboard.read', 'is_platform_owner', 'is_customer', 'customerView', 'customer_profiles', 'customerAvatarInput', 'uploadCustomerAvatarBtn', 'removeCustomerAvatarBtn', 'customer-avatars', 'createSignedUrl', 'AVATAR_MAX_BYTES', 'normalizeCustomerAvatar']) {
            if (!html.includes(required)) throw new Error('Required auth/access feature missing: ' + required);
          }

          if (/SUPABASE_SERVICE_ROLE_KEY\s*=\s*['"][^'"]+['"]|['"]sb_secret_[A-Za-z0-9_-]{10,}['"]/i.test(html)) {
            throw new Error('Server secret detected in browser source');
          }
          const serviceSettingsSql = fs.readFileSync('supabase/drafts/customer_service_admin_settings_v1.sql', 'utf8');
          const serviceSettingsTest = fs.readFileSync('supabase/tests/customer_service_admin_settings_v1.integration.sql', 'utf8');
          const serviceSettingsDoc = fs.readFileSync('docs/CUSTOMER_SERVICE_ADMIN_SETTINGS_V1.md', 'utf8');
          for (const required of ['customer_verification.master', 'customer_verification.phone_otp', 'customer_verification.nid', 'customer_verification.passport', 'customer_verification.biometric', 'customer_verification.ai_review', 'customer_payment.card_payments', 'ready_to_enable', 'platform_admin_roles', 'customer_service_feature_audit', 'security invoker', 'security definer']) {
            if (!serviceSettingsSql.toLowerCase().includes(required.toLowerCase())) throw new Error('Customer service settings control missing: ' + required);
          }
          for (const required of ['master-off', 'append-only', 'payment', 'readiness', 'expired']) {
            if (!serviceSettingsTest.toLowerCase().includes(required.toLowerCase())) throw new Error('Customer service settings test coverage missing: ' + required);
          }
          if (!serviceSettingsDoc.includes('No direct browser grants') || !serviceSettingsDoc.includes('OFF')) throw new Error('Customer service settings architecture contract incomplete');

          const customerSql = fs.readFileSync('supabase/drafts/customer_access_v1.sql', 'utf8');
          for (const required of ['enable row level security', 'customer_profiles_select_own', 'customer_profiles_update_own', 'customer_profiles_avatar_path_own', 'customer_avatars_select_own', 'customer_avatars_insert_own', 'customer_avatars_update_own', 'customer_avatars_delete_own', 'customer-avatars', '5242880', 'auth.uid()', 'security invoker', 'is_customer']) {
            if (!customerSql.toLowerCase().includes(required.toLowerCase())) throw new Error('Customer SQL security control missing: ' + required);
          }
          if (/grant\s+all\s+on\s+table\s+public\.customer_profiles\s+to\s+(anon|authenticated)/i.test(customerSql)) {
            throw new Error('Broad customer profile grant detected');
          }
          if (!/using\s*\(\s*\(select\s+auth\.uid\(\)\)\s*=\s*user_id\s*\)/i.test(customerSql)) {
            throw new Error('Customer profile ownership predicate missing');
          }
          const edge = fs.readFileSync('supabase/functions/auth-preview/index.ts', 'utf8');
          if (!edge.includes('Customer Dashboard') || !edge.includes('is_customer') || !edge.includes('customerAvatarInput') || !edge.includes('customer-avatars')) throw new Error('Edge Function is not synced with Customer avatar UI');
          console.log('PASS: JavaScript syntax, unique DOM IDs, DOM references, email-only auth, database gate, customer RLS draft, Edge Function sync, and no browser secrets.');
          NODE
