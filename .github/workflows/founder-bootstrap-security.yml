name: Founder Bootstrap Security Gate

on:
  push:
    branches:
      - feature/founder-owner-bootstrap-v1
  pull_request:
    branches:
      - main
      - feature/founder-owner-bootstrap-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founder-bootstrap-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-local-db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Static security tests
        run: node --test supabase/tests/founder_bootstrap_source.test.mjs

      - name: Type-check Edge Function
        run: deno check supabase/functions/owner-bootstrap/index.ts

      - name: Start disposable local Supabase
        run: supabase start

      - name: Reset local database to committed migrations
        run: supabase db reset --local

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply reviewed draft SQL to disposable local database
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/platform_owner_management_v1.sql
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/customer_access_v1.sql
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/first_project_founder_main_admin_bootstrap_v1.sql
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/founder_access_context_extension_v1.sql

      - name: Run positive and negative database security tests
        env:
          LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/founder_bootstrap_v1.integration.sql

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
