name: Platform Branding & Overview Checks

on:
  push:
    branches:
      - feature/platform-branding-overview-v1
    paths:
      - 'assets/**'
      - 'auth-preview/**'
      - 'branch-preview/**'
      - 'supabase/migrations/*platform_branding*'
      - 'docs/PLATFORM_BRANDING_OVERVIEW_V1.md'
      - '.github/workflows/platform-branding-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'auth-preview/**'
      - 'branch-preview/**'
      - 'supabase/migrations/*platform_branding*'
      - 'docs/PLATFORM_BRANDING_OVERVIEW_V1.md'
      - '.github/workflows/platform-branding-check.yml'

permissions:
  contents: read

jobs:
  static-platform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate platform pages and branding
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const cp = require('node:child_process');
          const files = ['auth-preview/index.html', 'branch-preview/index.html'];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
              .map(match => match[1]).filter(Boolean);
            if (!scripts.length) throw new Error(file + ': no inline script');
            for (const script of scripts) new vm.Script(script, { filename: file });
            const ids = [...html.matchAll(/\\bid=["']([^"']+)["']/g)].map(match => match[1]);
            const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
            if (duplicates.length) throw new Error(file + ': duplicate IDs ' + [...new Set(duplicates)].join(','));
            const refs = [...html.matchAll(/\\$\\(["']([^"']+)["']\\)/g)].map(match => match[1]);
            const missing = [...new Set(refs.filter(id => !ids.includes(id)))];
            if (missing.length) throw new Error(file + ': missing DOM IDs ' + missing.join(','));
            if (!html.includes('get_platform_branding_v1') || !html.includes('brandLogo')) {
              throw new Error(file + ': database branding RPC/logo integration missing');
            }
            if (!html.includes('current_access_context_v1') && file.startsWith('auth-preview')) {
              throw new Error('Authentication Preview: database access gate missing');
            }
          }
          const svg = fs.readFileSync('assets/mr-rahaman-logo.svg', 'utf8');
          if (!svg.includes('<svg') || !svg.includes('MR RAHAMAN')) throw new Error('SVG brand asset missing');
          const migration = fs.readdirSync('supabase/migrations')
            .filter(name => name.endsWith('_platform_branding_catalog_v1.sql'));
          if (migration.length !== 1) throw new Error('Expected exactly one platform branding migration');
          const sql = fs.readFileSync('supabase/migrations/' + migration[0], 'utf8');
          for (const required of ['enable row level security', 'security invoker', 'set search_path =', 'grant execute', 'platform_branding_public_read']) {
            if (!sql.toLowerCase().includes(required)) throw new Error('Migration security check missing: ' + required);
          }
          if (/grant\\s+(insert|update|delete|all)\\s+on\\s+table\\s+public\\.platform_branding\\s+to\\s+(anon|authenticated)/i.test(sql)) {
            throw new Error('Client write grant detected on platform_branding');
          }
          console.log('PASS: inline JavaScript syntax, DOM IDs, branding RPC, access gate, SVG asset, and read-only migration checks.');
          NODE
